name: Network Survey Release

on:
  push:
    tags:
      - 'v*'

  # Allows you to run this workflow manually from the Actions tab. A manual run
  # builds the CDR release APK (signed with the production key) and uploads it
  # as an artifact, but skips the tag-release attach job, since a manual run
  # has no tag to attach to.
  workflow_dispatch:

# "gh release upload" needs write access to the repository contents.
permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest

    strategy:
      matrix:
        api-level: [ 26, 36 ]
        target: [ default, google_apis ]

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Save google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: echo "$GOOGLE_SERVICES" > networksurvey/google-services.json

      - name: Unit Tests
        run: ./gradlew test --stacktrace

      # Only upload the reports on failure
      - name: Upload Reports
        uses: actions/upload-artifact@v6
        with:
          name: Test-Reports
          path: networksurvey/build/reports
        if: failure()

  buildCdrRelease:
    name: Build CDR release APK
    needs: test
    runs-on: ubuntu-latest

    steps:
      # A tag push checks out the tag itself. Never hardcode a branch here: the
      # upstream workflow checked out 'develop', which does not exist in this
      # fork, and the job died at this very step (run 45746024172).
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      # Release builds are ALWAYS signed with the production key. There is no
      # debug-key fallback on purpose: v1.2.0 was published debug-signed and
      # upgrading to a production-signed build already requires a one-time
      # uninstall; shipping another debug-signed release would make the break
      # happen twice. If the secrets are missing the build fails loudly here.
      - name: Restore release keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "::error::KEYSTORE_FILE secret is not configured. Add the repository secrets KEYSTORE_FILE (base64-encoded keystore), KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings > Secrets and variables > Actions, then re-run this job."
            exit 1
          fi
          echo "$KEYSTORE_FILE" | base64 -d > my.keystore
          test -s my.keystore || { echo "::error::KEYSTORE_FILE decoded to an empty file; check the base64 encoding."; exit 1; }

      - name: Build CDR Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
          OCID_API_KEY: ${{ secrets.OCID_API_KEY }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets are not all configured. Add them under Settings > Secrets and variables > Actions, then re-run this job."
            exit 1
          fi
          ./gradlew assembleCdrRelease
            -Pandroid.injected.signing.store.file=$(pwd)/my.keystore
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            -PnsApiKey="$NS_API_KEY"
            -PocidApiKey="$OCID_API_KEY"

      - name: Upload CDR APK
        uses: actions/upload-artifact@v6
        with:
          name: CDR Release APK
          path: networksurvey/build/outputs/apk/cdr/release/*.apk

  attach:
    name: Attach APK to the tag release
    needs: buildCdrRelease
    runs-on: ubuntu-latest
    # Only a tag push has a release to attach to; manual runs stop after the build.
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download CDR APK
        uses: actions/download-artifact@v6
        with:
          name: CDR Release APK
          path: apk/

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Attaching APKs to release ${TAG}"
          # The release is usually created manually ahead of the build; create a
          # minimal one if it is missing so the upload still lands somewhere
          # visible instead of failing silently.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "CDR release APK built by CI."
          gh release upload "$TAG" apk/*.apk --repo "$GITHUB_REPOSITORY" --clobber
