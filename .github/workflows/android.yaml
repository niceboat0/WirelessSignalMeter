name: Network Survey CI

on:
  # This fork works on main; keep develop listed too for upstream parity.
  pull_request:
    branches:
      - 'main'
      - 'develop'
  push:
    branches:
      - 'main'
      - 'develop'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    if: "! startsWith(github.event.head_commit.message, 'Bump version to')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build CDR APK
        env:
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
          OCID_API_KEY: ${{ secrets.OCID_API_KEY }}
        run: ./gradlew assembleCdrDebug
          -PnsApiKey=$NS_API_KEY
          -PocidApiKey=$OCID_API_KEY

      - name: Upload CDR APK
        uses: actions/upload-artifact@v6
        with:
          name: Network Survey CDR Debug APK
          path: networksurvey/build/outputs/apk/cdr/debug/*.apk

  host-c-tests:
    name: Host C tests (diag queue)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      # Only diag_queue_test for now: it is self-contained and covers the
      # priority-routing queue merged via PR #19. ims_logcat_test and
      # diag_session_file_test have never executed anywhere; enable them
      # after their first verified run instead of letting CI discover them.
      - name: Build and run diag_queue_test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -o diag_queue_test networksurvey/src/test/cpp/diag_queue_test.c
          ./diag_queue_test

  test:
    if: "! startsWith(github.event.head_commit.message, 'Bump version to')"
    name: Run Tests
    runs-on: macos-latest

    strategy:
      matrix:
        api-level: [ 26, 36 ]
        target: [ default, google_apis ]

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Save google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: echo "$GOOGLE_SERVICES" > networksurvey/google-services.json

      - name: Unit Tests
        run: ./gradlew test --stacktrace

      # Only upload the reports on failure
      - name: Upload Reports
        uses: actions/upload-artifact@v6
        with:
          name: Test-Reports
          path: networksurvey/build/reports
        if: failure()