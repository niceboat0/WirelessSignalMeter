android.applicationVariants.configureEach { variant ->
    variant.outputs.each { output ->
        def baseAbiVersionCode = project.ext.abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI))
        if (baseAbiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 1000 + baseAbiVersionCode
        }
    }
}

abstract class VerifyApkDexMethodSizes extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getApkDirectory()

    @Internal
    abstract Property<BuiltArtifactsLoader> getBuiltArtifactsLoader()

    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getCheckerSource()

    @Classpath
    abstract ConfigurableFileCollection getCheckerClasspath()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void verify() {
        def apks = builtArtifactsLoader.get().load(apkDirectory.get())?.elements?.collect { it.outputFile }
        if (!apks) {
            throw new GradleException("No APK outputs found in ${apkDirectory.get().asFile}")
        }
        def javaExecutable = new File(
            System.getProperty("java.home"),
            "bin/java${System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows") ? ".exe" : ""}",
        )
        execOperations.exec {
            commandLine javaExecutable.absolutePath,
                "--class-path", checkerClasspath.asPath, checkerSource.get().asFile.absolutePath
            args(apks)
        }
    }
}

def dexSizeChecker = configurations.create("dexSizeChecker") {
    canBeConsumed = false
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def variantName = variant.name.capitalize()
    def verify = tasks.register("verify${variantName}DexMethodSizes", VerifyApkDexMethodSizes) {
        group = "verification"
        description = "Checks all packaged DEX methods against the ART compiler size limit."
        apkDirectory.set(variant.artifacts.get(SingleArtifact.APK.INSTANCE))
        builtArtifactsLoader.set(variant.artifacts.builtArtifactsLoader)
        checkerSource.set(rootProject.layout.projectDirectory.file("tools/CheckApkDexMethodSizes.java"))
        checkerClasspath.from(dexSizeChecker)
    }
    tasks.configureEach { task ->
        if (task.name == "assemble${variantName}") task.finalizedBy(verify)
    }
}

