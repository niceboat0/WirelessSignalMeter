def appVersion = "1.2.1"
base {
    archivesName = "$applicationName-$appVersion"
}

// ABI-specific version codes: baseVersionCode * 1000 + abiCode (F-Droid splitabi convention)
// Each release slot spans 1000 codes (e.g. v-code 111 -> 111001..111004)
// Dual-ABI devices still prefer arm64 (002) over armv7 (001) via tie-break
// WARNING: abiCode must stay below 1000 to avoid range collisions
// Universal APK keeps the raw versionCode (lowest priority fallback)
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86": 3, "x86_64": 4]

android {
    compileSdk = 37
    compileSdkMinor = 2
    ndkVersion = "27.3.13750724"

    splits {
        abi {
            enable = true
            reset()
            include "arm64-v8a"
            // Universal APK 仅对 F-Droid 分发有用；无线无忧只发 arm64-v8a 单包
            universalApk = false
        }
    }

    defaultConfig {
        buildConfigField "String", "MESSAGING_API_VERSION", "\"${libs.versions.networkSurveyMessaging.get()}\""
        buildConfigField 'String', "NS_API_KEY", "\"${nsApiKey}\""
        applicationId "com.wireless.signalmeter.new"
        minSdkVersion 33
        targetSdkVersion 37
        versionCode 121
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev" // Suffix for debug builds
            resValue "string", "app_name", "无线无忧 - dev"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // 正式 keystore 已随 yzy 误删丢失，先用 debug 签名出可装机包
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
        dataBinding = true
        compose = true
        buildConfig = true
        resValues = true
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    packagingOptions {
        jniLibs {
            // The Root helper is a standalone executable launched from the installed lib directory.
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties', 'google/cloud/audit/audit_log.proto']
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
    }

    lint {
        abortOnError = false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    namespace = 'com.craxiom.networksurvey'

    flavorDimensions = ["version"]
    productFlavors {
        // 无追踪 CDR flavor（无线无忧使用，无 Firebase）
        cdr {
            versionNameSuffix ""
        }
    }

}

abstract class CompileRootDiag extends DefaultTask {
    @Input
    abstract Property<String> getBinaryName()

    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getSourceFile()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getDecoderSources()

    @Internal
    abstract DirectoryProperty getNdkDirectory()

    @Input
    abstract Property<String> getNdkVersion()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void compile() {
        def os = System.getProperty("os.name").toLowerCase(Locale.ROOT)
        def host = os.startsWith("windows") ? "windows-x86_64" :
            (os.startsWith("mac") ? "darwin-x86_64" : "linux-x86_64")
        def suffix = os.startsWith("windows") ? ".exe" : ""
        def ndk = ndkDirectory.get()
        def clang = ndk.file("toolchains/llvm/prebuilt/$host/bin/clang$suffix").asFile
        def binary = outputDirectory.file("arm64-v8a/${binaryName.get()}").get().asFile
        binary.parentFile.mkdirs()
        execOperations.exec {
            commandLine clang, "--target=aarch64-linux-android33", "-std=gnu17", "-O2", "-fPIE", "-pie",
                "-Wl,-z,max-page-size=16384", "-Wl,-z,relro,-z,now", sourceFile.get().asFile,
                "-o", binary, "-ldl", "-llog", "-lm"
        }
    }
}

def compileRootDiag = tasks.register("compileRootDiag", CompileRootDiag) {
    binaryName.set("libwireless_root_diag.so")
    sourceFile.set(layout.projectDirectory.file("src/main/cpp/root_diag.c"))
    decoderSources.from(fileTree("src/main/cpp") { include "sigdec.c", "nasdec.c", "rrc_schema.h", "diag_queue.c", "diag_queue.h", "ims_logcat.c", "ims_logcat.h", "lte_b193_sinr.h", "nr_band_guess.h", "nr_csf_window.h" })
    ndkDirectory.set(androidComponents.sdkComponents.ndkDirectory)
    ndkVersion.set(android.ndkVersion)
    outputDirectory.set(layout.buildDirectory.dir("generated/rootDiag/jniLibs"))
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.jniLibs.addGeneratedSourceDirectory(compileRootDiag) { it.outputDirectory }
}

